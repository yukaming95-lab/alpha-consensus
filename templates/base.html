<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Alpha Consensus{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/">⚡ Alpha Consensus</a>
    <div class="nav-links">
      <a href="/" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/my-portfolio" class="{% if request.endpoint == 'my_portfolio' %}active{% endif %}">💼 My Portfolio</a>
      <a href="/signals" class="{% if request.endpoint == 'signals' %}active{% endif %}">📈 Signals</a>
      <a href="/news" class="{% if request.endpoint == 'news' %}active{% endif %}">📰 News</a>
      <a href="/qa" class="{% if request.endpoint == 'qa' %}active{% endif %}">Q&amp;A</a>
      <a href="/admin" class="{% if request.endpoint == 'admin' %}active{% endif %}">Admin</a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
